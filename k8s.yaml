# =============================================================================
# Sharinmod + LiteLLM Kubernetes Deployment
# =============================================================================
#
# 前置条件：
#   1. 构建并推送 Docker 镜像（将 IMAGE_REGISTRY 替换为你的镜像仓库）：
#        docker build -t <IMAGE_REGISTRY>/sharinmod-backend:latest ./backend
#        docker build -t <IMAGE_REGISTRY>/sharinmod-frontend:latest ./frontend
#        docker push <IMAGE_REGISTRY>/sharinmod-backend:latest
#        docker push <IMAGE_REGISTRY>/sharinmod-frontend:latest
#      若使用本地 kind 集群，可跳过推送：
#        kind load docker-image sharinmod-backend:latest
#        kind load docker-image sharinmod-frontend:latest
#
#   2. 创建 sharinmod-env Secret（推荐直接从 .env 文件创建，注意先将其中的
#      DATABASE_URI 主机改为 postgres、LITELLM_BASE_URL 改为 http://litellm:4000）：
#        kubectl create secret generic sharinmod-env -n sharinmod --from-env-file=.env
#      或直接编辑本文件中的 sharinmod-env Secret 模板后 apply。
#
#   3. 部署：
#        kubectl apply -f k8s.yaml
#
#   4. 数据库迁移（首次部署后执行）：
#        kubectl exec -n sharinmod deploy/sharinmod-backend -- alembic upgrade head
#
# 访问：
#   - Nginx NodePort 默认暴露 30888 端口：http://<节点IP>:30888
#   - 如需 LoadBalancer，将 nginx Service 的 type 改为 LoadBalancer
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: sharinmod

---
# =============================================================================
# Secrets
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: sharinmod
type: Opaque
stringData:
  postgres-password: "postgres"
  llmproxy-password: "dbpassword9090"

---

apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: sharinmod
type: Opaque
stringData:
  master-key: "sk-1234"

---

# sharinmod-env 镜像 .env 文件的全量 Secret。
# 若使用 kubectl create secret generic sharinmod-env -n sharinmod --from-env-file=.env
# 创建，则删除本 Secret 定义即可；否则在此填写真实值。
# DATABASE_URI / LITELLM_BASE_URL 在下方 Deployment 中已用 K8s Service 地址覆盖。
apiVersion: v1
kind: Secret
metadata:
  name: sharinmod-env
  namespace: sharinmod
type: Opaque
stringData:
  DATABASE_URI: "postgresql://postgres:postgres@postgres:5432/sharinmod"
  SECRET_KEY: ""                    # 填写 .env 中的 SECRET_KEY
  GITHUB_CLIENT_ID: ""              # 填写 .env 中的 GITHUB_CLIENT_ID
  GITHUB_CLIENT_SECRET: ""          # 填写 .env 中的 GITHUB_CLIENT_SECRET
  GITLAB_CLIENT_ID: ""              # 填写 .env 中的 GITLAB_CLIENT_ID
  GITLAB_CLIENT_SECRET: ""          # 填写 .env 中的 GITLAB_CLIENT_SECRET
  LITELLM_BASE_URL: "http://litellm:4000"
  LITELLM_MASTER_KEY: "sk-1234"     # 与 litellm-secrets 保持一致
  SHARINMOD_ADMIN_EMAIL: "admin@sharin.mod"
  SHARINMOD_ADMIN_PASSWORD: "Aha12345!"

---
# =============================================================================
# ConfigMaps
# =============================================================================

# PostgreSQL 初始化脚本：同时创建 sharinmod 和 litellm 两个数据库
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: sharinmod
data:
  init.sql: |
    -- sharinmod 数据库（使用默认 postgres 用户）
    CREATE DATABASE sharinmod;

    -- litellm 数据库（单独用户）
    CREATE USER llmproxy WITH PASSWORD 'dbpassword9090';
    CREATE DATABASE litellm OWNER llmproxy;
    GRANT ALL PRIVILEGES ON DATABASE litellm TO llmproxy;

---

# Nginx 配置：路由前端、后端和 LiteLLM
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: sharinmod
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        upstream frontend {
            server sharinmod-frontend:3000;
        }

        upstream backend {
            server sharinmod-backend:8000;
        }

        upstream litellm {
            server litellm:4000;
        }

        server {
            listen 80;
            client_max_body_size 50M;

            proxy_connect_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;

            location /api/openai/ {
                proxy_pass http://litellm/;
            }

            location /api/anthropic/ {
                proxy_pass http://litellm/;
            }

            location ~* ^/api/claws/[0-9]+/logs$ {
                proxy_pass http://backend;
                proxy_read_timeout 86400s;
                proxy_buffering off;
                proxy_cache off;
            }

            location /api/ {
                proxy_pass http://backend;
            }

            location / {
                proxy_pass http://frontend;
            }
        }
    }

---

# Sharinmod 后端配置文件
# 敏感字段留空，通过 env var 注入（见 CLAUDE.md 的 fallback 机制）
apiVersion: v1
kind: ConfigMap
metadata:
  name: sharinmod-config
  namespace: sharinmod
data:
  config.yaml: |
    workspace_storage_class: ""
    workspace_storage_size: "10Gi"

    app:
      env: "production"
      database_uri: ""         # 由环境变量 DATABASE_URI 注入
      secret_key: ""           # 由环境变量 SECRET_KEY 注入（空则自动生成，重启后失效）
      github_client_id: ""
      github_client_secret: ""
      github_redirect_uri: ""
      gitlab_client_id: ""
      gitlab_client_secret: ""
      gitlab_base_url: "https://gitlab.com"
      gitlab_redirect_uri: ""
      website_base_url: ""     # 部署后填写对外访问地址，如 http://<节点IP>:30888
      litellm_base_url: ""     # 由环境变量 LITELLM_BASE_URL 注入
      litellm_master_key: ""   # 由环境变量 LITELLM_MASTER_KEY 注入
      assets_path: "/app/assets"
      redis_database: "redis://redis:6379/0"
      sharinmod_admin_email: ""    # 由环境变量 SHARINMOD_ADMIN_EMAIL 注入
      sharinmod_admin_password: "" # 由环境变量 SHARINMOD_ADMIN_PASSWORD 注入
      access_token_expire_minutes: 10080

    claw_types: {}  # 在此处配置 claw 类型，参考 etc/config.yaml.example

---

# Kubernetes kubeconfig 文件（用于 Claw Status Consumer 访问 K8s API）
# 默认使用 in-cluster 配置，使用 ServiceAccount 自动注入的 token 和 ca.crt
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeconfig
  namespace: sharinmod
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        server: https://kubernetes.default.svc
      name: in-cluster
    contexts:
    - context:
        cluster: in-cluster
        user: serviceaccount
      name: default-context
    current-context: default-context
    users:
    - name: serviceaccount
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

---

# ServiceAccount 和 RBAC（用于 Claw Status Consumer 访问 K8s API）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sharinmod-backend
  namespace: sharinmod

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claw-status-reader
  namespace: sharinmod
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claw-status-reader-binding
  namespace: sharinmod
subjects:
  - kind: ServiceAccount
    name: sharinmod-backend
    namespace: sharinmod
roleRef:
  kind: Role
  name: claw-status-reader
  apiGroup: rbac.authorization.k8s.io

---

# LiteLLM 配置文件
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: sharinmod
data:
  config.yaml: |
    litellm_settings:
      num_retries: 6
      request_timeout: 600
      telemetry: False
      success_callback: ["generic_api"]
      failure_callback: ["generic_api"]

    router_settings:
      routing_strategy: usage-based-routing-v2
      redis_host: "redis"
      redis_password: ""
      redis_port: "6379"
      enable_pre_call_checks: false

    general_settings:
      database_connection_pool_limit: 10
      maximum_spend_logs_retention_period: "1d"
      maximum_spend_logs_retention_interval: "1h"

    literals:
      turn_off_message_logging: false

---
# =============================================================================
# PersistentVolumeClaim
# =============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: sharinmod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
# =============================================================================
# PostgreSQL（sharinmod + litellm 共用）
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sharinmod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate   # 避免多个副本同时挂载同一 PVC
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-password
            - name: POSTGRES_DB
              value: "postgres"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-init
          configMap:
            name: postgres-init

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sharinmod
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# =============================================================================
# Redis
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sharinmod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sharinmod
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# =============================================================================
# LiteLLM Proxy
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: sharinmod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U postgres; do
                echo "Waiting for postgres..."; sleep 2
              done
      containers:
        - name: litellm
          image: hub.upyun.com/holdcloud/litellm:v1.80.8-dev.6
          args:
            - --num_workers=4
            - --config=/app/config.yaml
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
          env:
            - name: DATABASE_URL
              value: "postgresql://llmproxy:dbpassword9090@postgres:5432/litellm"
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: GENERIC_LOGGER_ENDPOINT
              value: "http://sharinmod-backend:8000/api/v1/webhooks/litellm/spendlog"
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config

---

apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: sharinmod
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000

---
# =============================================================================
# Sharinmod Backend
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharinmod-backend
  namespace: sharinmod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sharinmod-backend
  template:
    metadata:
      labels:
        app: sharinmod-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U postgres; do
                echo "Waiting for postgres..."; sleep 2
              done
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis ping | grep -q PONG; do
                echo "Waiting for redis..."; sleep 2
              done
      containers:
        - name: backend
          image: sharinmod-backend:latest  # 替换为实际镜像地址
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # 从 sharinmod-env Secret 整体导入 .env 中的所有变量
          envFrom:
            - secretRef:
                name: sharinmod-env
          # 覆盖需要使用 K8s Service 名的变量
          env:
            - name: CONFIG_PATH
              value: "/app/config.yaml"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URI
              value: "postgresql://postgres:postgres@postgres:5432/sharinmod"
            - name: LITELLM_BASE_URL
              value: "http://litellm:4000"
            # LITELLM_WEBHOOK_IP_WHITELIST_STR：K8s 中 LiteLLM pod IP 是动态的，
            # 建议设置为 Pod 所在 CIDR，例如：
            # - name: LITELLM_WEBHOOK_IP_WHITELIST_STR
            #   value: "10.0.0.0/8"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: sharinmod-config

---

apiVersion: v1
kind: Service
metadata:
  name: sharinmod-backend
  namespace: sharinmod
spec:
  selector:
    app: sharinmod-backend
  ports:
    - port: 8000
      targetPort: 8000

---
# =============================================================================
# Sharinmod Frontend
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharinmod-frontend
  namespace: sharinmod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sharinmod-frontend
  template:
    metadata:
      labels:
        app: sharinmod-frontend
    spec:
      containers:
        - name: frontend
          image: sharinmod-frontend:latest  # 替换为实际镜像地址
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: sharinmod-frontend
  namespace: sharinmod
spec:
  selector:
    app: sharinmod-frontend
  ports:
    - port: 3000
      targetPort: 3000

---
# =============================================================================
# LiteLLM Callback Consumer（Sharinmod 后台任务）
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-callback-consumer
  namespace: sharinmod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-callback-consumer
  template:
    metadata:
      labels:
        app: litellm-callback-consumer
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z sharinmod-backend 8000; do
                echo "Waiting for backend..."; sleep 3
              done
      containers:
        - name: consumer
          image: sharinmod-backend:latest  # 替换为实际镜像地址
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "api.consumers.litellm_callback_consumer"]
          # 从 sharinmod-env Secret 整体导入 .env 中的所有变量
          envFrom:
            - secretRef:
                name: sharinmod-env
          # 覆盖需要使用 K8s Service 名的变量
          env:
            - name: CONFIG_PATH
              value: "/app/config.yaml"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URI
              value: "postgresql://postgres:postgres@postgres:5432/sharinmod"
            - name: LITELLM_BASE_URL
              value: "http://litellm:4000"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: sharinmod-config

---
# =============================================================================
# Claw Status Consumer（Claw 状态同步消费者）
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-status-consumer
  namespace: sharinmod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claw-status-consumer
  template:
    metadata:
      labels:
        app: claw-status-consumer
    spec:
      serviceAccountName: sharinmod-backend  # 使用 RBAC ServiceAccount
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U postgres; do
                echo "Waiting for postgres..."; sleep 2
              done
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis ping | grep -q PONG; do
                echo "Waiting for redis..."; sleep 2
              done
      containers:
        - name: consumer
          image: sharinmod-backend:latest  # 替换为实际镜像地址
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "api.consumers.claw_status_consumer"]
          # 从 sharinmod-env Secret 整体导入 .env 中的所有变量
          envFrom:
            - secretRef:
                name: sharinmod-env
          # 覆盖需要使用 K8s Service 名的变量
          env:
            - name: CONFIG_PATH
              value: "/app/config.yaml"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URI
              value: "postgresql://postgres:postgres@postgres:5432/sharinmod"
            - name: LITELLM_BASE_URL
              value: "http://litellm:4000"
            - name: KUBECONFIG_PATH
              value: "/app/kubeconfig"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: kubeconfig
              mountPath: /app/kubeconfig
              subPath: kubeconfig
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sharinmod-config
        - name: kubeconfig
          configMap:
            name: kubeconfig

---

# =============================================================================
# Nginx（入口，NodePort 30888）
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: sharinmod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf

---

apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: sharinmod
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30888
