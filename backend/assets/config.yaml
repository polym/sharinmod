# Claw Types Configuration
# 每个 claw_type 定义：
#   image          - 容器镜像地址
#   model_id       - 传入 config_template 的 {{MODEL_ID}} 占位符
#   command        - （可选）覆盖容器 entrypoint，对应 K8s spec.containers[].command
#                    省略时使用镜像默认 entrypoint
#   config_template - dict，key 为挂载到 /config/ 目录下的文件名，value 为文件内容模版
#                     每个 value 支持以下占位符：
#                     {{MODEL_ID}}        - AI 模型 ID
#                     {{OPENAI_KEY}}      - LiteLLM 生成的 API Key
#                     {{OPENAI_BASE_URL}} - OpenAI-compatible API 基地址
#                     {{YOUR_APP_ID}}     - QQ Bot App ID
#                     {{YOUR_APP_SECRET}} - QQ Bot App Secret

claw_types:
  NANOBOT:
    image: "hub.upyun.xxkc/nanobot/nanobot:latest"
    model_id: "minimax-m2.5"
    command: ["bash", "-c", "cp /config/config.json /app/config.json && nanobot gateway -c /app/config.json"]
    config_template:
      config.json: |
        {
          "agents": {
            "defaults": {
              "workspace": "/app/workspace",
              "model": "{{MODEL_ID}}",
              "provider": "custom",
              "maxTokens": 8192,
              "temperature": 0.1,
              "maxToolIterations": 40,
              "memoryWindow": 100,
              "reasoningEffort": null,
              "memory": {
                "path": "/app/memory"
              }
            }
          },
          "providers": {
            "custom": {
              "apiKey": "{{OPENAI_KEY}}",
              "apiBase": "{{OPENAI_BASE_URL}}",
              "extraHeaders": null
            }
          },
          "channels": {
            "qq": {
              "enabled": true,
              "appId": "{{YOUR_APP_ID}}",
              "secret": "{{YOUR_APP_SECRET}}",
              "allowFrom": ["*"],
              "msgFormat": "plain"
            }
          }
        }

  OPENCLAW:
    image: "registry.example.com/openclaw:latest"
    model_id: "gpt-4o"
    config_template:
      config.toml: |
        [model]
        model_id = "{{MODEL_ID}}"
        api_key = "{{OPENAI_KEY}}"
        base_url = "{{OPENAI_BASE_URL}}"

        [bot]
        app_id = "{{YOUR_APP_ID}}"
        app_secret = "{{YOUR_APP_SECRET}}"

        [server]
        host = "0.0.0.0"
        port = 8080

  ZEROBOT:
    image: "registry.example.com/zerobot:latest"
    model_id: "gpt-4o-mini"
    config_template:
      config.toml: |
        [model]
        model_id = "{{MODEL_ID}}"
        api_key = "{{OPENAI_KEY}}"
        base_url = "{{OPENAI_BASE_URL}}"

        [bot]
        app_id = "{{YOUR_APP_ID}}"
        app_secret = "{{YOUR_APP_SECRET}}"

        [server]
        host = "0.0.0.0"
        port = 8080
