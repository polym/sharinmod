version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - my-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - my-network
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URI=postgresql://postgres:postgres@db:5432/sharinmod
      - REDIS_DATABASE=redis://redis:6379/0

  db:
    image: postgres:15-alpine
    restart: always
    container_name: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-network
    ports:
      - 5454:5432
    expose:
      - 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sharinmod

  redis:
    image: redis:7-alpine
    restart: always
    container_name: redis
    networks:
      - my-network
    ports:
      - 6379:6379

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - prometheus_data:/prometheus
    networks:
      - my-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'


  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3001:3000
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - my-network
volumes:
  prometheus_data:
  grafana_data:
  postgres_data:

networks:
  my-network:
    driver: bridge

