services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - my-network
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/components.json:/app/components.json
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    networks:
      - my-network
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URI=postgresql://postgres:postgres@db:5432/sharinmod
      - REDIS_DATABASE=redis://redis:6379/0
      - LITELLM_WEBHOOK_IP_WHITELIST_STR=192.168.96.7
      - PYTHONUNBUFFERED=1
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - WEBSITE_BASE_URL=${WEBSITE_BASE_URL}
    volumes:
      - ./backend:/app

  # Consumer for LiteLLM callback processing
  litellm-callback-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
      - backend
    networks:
      - my-network
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URI=postgresql://postgres:postgres@db:5432/sharinmod
      - REDIS_DATABASE=redis://redis:6379/0
    restart: unless-stopped
    command: ["python", "-m", "api.consumers.litellm_callback_consumer"]
    volumes:
      - ./backend:/app

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-network
    expose:
      - 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sharinmod

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - my-network

  nginx:
    image: nginx:alpine
    expose:
      - 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - my-network

volumes:
  postgres_data:

networks:
  my-network:
    driver: bridge

