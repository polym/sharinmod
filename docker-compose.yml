services:
  frontend:
    image: sharinmod-frontend:${VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - my-network
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/components.json:/app/components.json
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json

  backend:
    image: sharinmod-backend:${VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    networks:
      - my-network
    env_file:
      - ./.env
    environment:
      - CONFIG_PATH=/app/config.yaml
      - KUBECONFIG_PATH=/app/kubeconfig
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./frontend/public:/app/frontend/public
      - ./etc/config.yaml:/app/config.yaml:ro
      - ./etc/kubeconfig:/app/kubeconfig:ro

  # Consumer for LiteLLM callback processing
  litellm-callback-consumer:
    image: sharinmod-backend:${VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
      - backend
    networks:
      - my-network
    env_file:
      - ./.env
    environment:
      - CONFIG_PATH=/app/config.yaml
    restart: unless-stopped
    command: ["python", "-m", "api.consumers.litellm_callback_consumer"]
    volumes:
      - ./backend:/app
      - ./etc/config.yaml:/app/config.yaml:ro

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-network
    expose:
      - 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sharinmod

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - my-network

  nginx:
    image: nginx:alpine
    ports:
      - "${HOST_PORT:-18888}:80"
    volumes:
      - ./etc/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - my-network

volumes:
  postgres_data:

networks:
  my-network:
    driver: bridge

