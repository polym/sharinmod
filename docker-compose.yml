services:
  frontend:
    image: sharinmod-frontend:${VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - my-network
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/components.json:/app/components.json
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - /etc/localtime:/etc/localtime:ro

  backend:
    image: sharinmod-backend:${VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    networks:
      - my-network
    env_file:
      - ./.env
    environment:
      - CONFIG_PATH=/srv/config.yaml
      - KUBECONFIG_PATH=/srv/kubeconfig
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./frontend/public:/app/frontend/public
      - ./etc/config.yaml:/srv/config.yaml:ro
      - ./etc/kubeconfig:/srv/kubeconfig:ro
      - ./etc/providers.yaml:/srv/providers.yaml:ro
      - /etc/localtime:/etc/localtime:ro

  # Consumer for LiteLLM callback processing
  litellm-callback-consumer:
    image: sharinmod-backend:${VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
      - backend
    networks:
      - my-network
    env_file:
      - ./.env
    environment:
      - CONFIG_PATH=/srv/config.yaml
    restart: unless-stopped
    command: ["python", "-m", "api.consumers.litellm_callback_consumer"]
    volumes:
      - ./backend:/app
      - ./etc/config.yaml:/srv/config.yaml:ro
      - /etc/localtime:/etc/localtime:ro

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./etc/init-litellm-db.sh:/docker-entrypoint-initdb.d/init-litellm-db.sh:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - my-network
    expose:
      - 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sharinmod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - my-network
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: hub.upyun.com/holdcloud/litellm:v1.80.8-hx.hack-org.1
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - my-network
    ports:
      - "${LITELLM_EPORT:-14000}:4000"
    environment:
      - DATABASE_URL=postgresql://${LITELLM_DB_USER:-llmproxy}:${LITELLM_DB_PASSWORD:-dbpassword9090}@db:5432/litellm
      - STORE_MODEL_IN_DB=True
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234}
      - GENERIC_LOGGER_ENDPOINT=http://backend:8000/api/v1/webhooks/litellm/spendlog
    command: ["--config", "/app/config.yaml", "--num_workers", "4"]
    volumes:
      - ./etc/litellm-config.yaml:/app/config.yaml:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_EPORT:-10080}:80"
    volumes:
      - ./etc/nginx.conf:/etc/nginx/nginx.conf
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - frontend
      - backend
      - litellm
    networks:
      - my-network

volumes:
  postgres_data:

networks:
  my-network:
    driver: bridge

