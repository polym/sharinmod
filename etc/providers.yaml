# Provider and Model Configuration
# This file defines the built-in providers and models that will be imported into the database
# on application startup. Each provider can have multiple models with their configurations.

providers:
  - provider_key: "bigmodel"
    name: "智谱 AI Coding Plan"
    website: "https://bigmodel.cn"
    base_url: "https://open.bigmodel.cn/api/anthropic"
    custom_llm_provider: "anthropic"
    models:
      - model_key: "glm-5"
        display_name: "GLM-5"
        description: "智谱 AI 最新一代旗舰模型，超长上下文支持"
        context_length: "200k"
        max_output_length: "4k"
        input_types: ["Text"]
        output_types: ["Text"]
      - model_key: "glm-4.7"
        display_name: "GLM-4.7"
        description: "智谱 AI 最新一代旗舰模型，具备强大的理解和生成能力"
        context_length: "128k"
        max_output_length: "4k"
        input_types: ["Text"]
        output_types: ["Text"]
        coding_score: 1441
      - model_key: "glm-4.6"
        display_name: "GLM-4.6"
        description: "智谱 AI 高性能模型，平衡速度与质量"
        context_length: "128k"
        max_output_length: "4k"
        input_types: ["Text"]
        output_types: ["Text"]
        coding_score: 1356
      - model_key: "glm-4.5-air"
        display_name: "GLM-4.5 Air"
        description: "智谱 AI 轻量级模型，快速响应适合简单任务"
        context_length: "128k"
