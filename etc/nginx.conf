events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        client_max_body_size 50M;

        location /api/openai/ {
            proxy_pass http://litellm:4000/;
        }

        location /api/anthropic/ {
            proxy_pass http://litellm:4000/;
        }

        location ~* ^/api/claws/[0-9]+/logs$ {
            proxy_pass http://backend;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        location ~* ^/api/claws/[0-9]+/filebrowser(/|$) {
            proxy_pass http://backend;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 0;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
        }

        location /api/ {
            proxy_pass http://backend;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}