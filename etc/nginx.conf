events {
    worker_connections 1024;
}

http {
    # 使用 Docker 内部 DNS 服务器，动态解析容器 IP
    resolver 127.0.0.11 valid=5s;

    # WebSocket 连接升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        client_max_body_size 50M;

        # 后端服务地址（使用变量强制动态解析）
        set $backend_addr "backend:8000";
        set $litellm_addr "litellm:4000";
        set $frontend_addr "frontend:3000";

        location /api/openai/ {
            # 重写 URI：去掉 /api/openai 前缀，保留剩余路径
            rewrite ^/api/openai/(.*) /$1 break;
            # proxy_pass 使用变量但不带斜杠，避免 URI 问题
            proxy_pass http://$litellm_addr;
            # 被动健康检查：失败后尝试下一个请求
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location /api/anthropic/ {
            # 重写 URI：去掉 /api/anthropic 前缀，保留剩余路径
            rewrite ^/api/anthropic/(.*) /$1 break;
            proxy_pass http://$litellm_addr;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location ~* ^/api/claws/[0-9]+/logs$ {
            proxy_pass http://$backend_addr;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        location ~* ^/api/claws/[0-9]+/filebrowser(/|$) {
            proxy_pass http://$backend_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 0;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
        }

        location ~* ^/api/claws/[0-9]+/openclaw-web(/|$) {
            proxy_pass http://$backend_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 0;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /api/ {
            proxy_pass http://$backend_addr;
        }

        location / {
            proxy_pass http://$frontend_addr;
        }
    }
}
